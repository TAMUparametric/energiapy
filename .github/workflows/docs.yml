name: Documentation
on: [pull_request, push]
permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: python -m sphinx -W --keep-going -b html docs "$RUNNER_TEMP/html"
