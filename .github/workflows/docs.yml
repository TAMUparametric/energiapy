name: Documentation
on: [pull_request, push]
permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python docs/_shared/check.py
      - run: python -m pip install -c docs/_shared/constraints.txt -e '.[docs]'
      - run: python -m sphinx -W --keep-going -b html docs "$RUNNER_TEMP/html"
      - name: Verify documentation controls in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/docs-browser/node_modules" node docs/_shared/browser-check.cjs "$RUNNER_TEMP/html"
