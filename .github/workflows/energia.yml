name: Python package

on:
  push:
    branches: [ "main"]
    paths-ignore:
    - 'docs/**'
    - 'README.md'
    - 'LICENSE'
    - '*.yml'
  pull_request:
    branches: [ "main"]
  workflow_call:

# Validate the paired plotting PR before the required Gana release exists.
# Main/release installs continue to use published packages.
env:
  PIP_CONSTRAINT: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && format('{0}/requirements/plotting-integration.txt', github.workspace) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare pinned Gana build toolchain
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main'))
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify release tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != version:
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r}.")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' build

      - name: Build wheel from source distribution
        run: python -m build

      - name: Validate installed wheel and solve a one-period model
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python -m pip check
          wheel-env/bin/python -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
          wheel-env/bin/python -I "$GITHUB_WORKSPACE/tools/plotting_gallery.py" "$RUNNER_TEMP/figures"

      - name: Run tests
        run: pytest --cov=energia --cov-branch --cov-report=json --cov-report=xml --cov-report=term-missing tests/

      - name: Enforce statement and branch coverage floors
        run: python tools/check_coverage.py

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check release distribution metadata
        if: github.event_name == 'release' && matrix.python-version == '3.12'
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Preserve validated release distributions
        if: github.event_name == 'release' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: energiapy-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
