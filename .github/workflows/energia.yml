name: Python package

on:
  push:
    branches: [ "main"]
    paths-ignore:
    - 'docs/**'
    - 'README.md'
    - 'LICENSE'
    - '*.yml'
  pull_request:
    branches: [ "main"]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' build

      - name: Build wheel from source distribution
        run: python -m build

      - name: Validate installed wheel and solve a one-period model
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python -m pip check
          wheel-env/bin/python -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py"

      - name: Run tests
        run: pytest --cov=energia --cov-branch --cov-report=json --cov-report=xml --cov-report=term-missing tests/

      - name: Enforce statement and branch coverage floors
        run: python tools/check_coverage.py

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
