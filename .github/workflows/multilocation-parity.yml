name: Legacy multi-location parity
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/multilocation_parity/**'
      - 'tests/multilocation_parity_test.py'
      - '.github/workflows/multilocation-parity.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      full_year:
        description: 'Check all 8,760 chronological hours'
        type: boolean
        default: false
permissions:
  contents: read

# Validate the paired plotting PR before the required Gana release exists.
# Main/release installs continue to use published packages.
env:
  PIP_CONSTRAINT: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && format('{0}/requirements/plotting-integration.txt', github.workspace) || '' }}

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Gana build toolchain
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main'))
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' -r tools/multilocation_parity/current-requirements.txt ruff==0.17.5
      - run: |
          ruff check tools/multilocation_parity
          ruff format --check tools/multilocation_parity
          python -m pytest -q tests/multilocation_parity_test.py
      - name: Solve and verify both formulations
        env:
          HOURS: ${{ inputs.full_year && '8760' || '48' }}
        run: python -m tools.multilocation_parity "$RUNNER_TEMP/parity" --hours "$HOURS"
      - name: Check pinned historical implementation
        if: ${{ !inputs.full_year }}
        env:
          PIP_CONSTRAINT: ''
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/legacy-venv"
          "$RUNNER_TEMP/legacy-venv/bin/python" -m pip install -r tools/multilocation_parity/legacy-requirements.txt
          curl -L --fail https://codeload.github.com/TAMUparametric/energiapy/tar.gz/c78c8902a7b45be4ed6d56a47341286271e855bf -o "$RUNNER_TEMP/legacy.tar.gz"
          printf '%s  %s\n' 7eccb26670817b09eb9c88d8672c950a04bf447c29dbc78f4bbb1d47957636e4 "$RUNNER_TEMP/legacy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/legacy-source"
          tar -xzf "$RUNNER_TEMP/legacy.tar.gz" -C "$RUNNER_TEMP/legacy-source" --strip-components=1
          PYTHONPATH="$RUNNER_TEMP/legacy-source/src" "$RUNNER_TEMP/legacy-venv/bin/python" -m tools.multilocation_parity.legacy "$RUNNER_TEMP/parity/legacy" --hours 48 --compare "$RUNNER_TEMP/parity/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multilocation-parity
          path: ${{ runner.temp }}/parity
