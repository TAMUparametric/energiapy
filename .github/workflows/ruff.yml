name: Python style
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.5
      - name: Check lint and formatting for changed Python files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          git diff --name-only --no-renames --diff-filter=AM -z "$BASE" HEAD -- 'src/**/*.py' 'tools/*.py' > "$RUNNER_TEMP/ruff-files"
          mapfile -d '' files < "$RUNNER_TEMP/ruff-files"
          if ! git diff --quiet "$BASE" HEAD -- ruff.toml; then
            files=(src)
            if [[ -d tools ]]; then files+=(tools); fi
          fi
          if (( ${#files[@]} )); then
            ruff check -- "${files[@]}"
            ruff format --check -- "${files[@]}"
          fi
