name: Cyclomatic complexity
on: [pull_request, push]
permissions:
  contents: read

jobs:
  radon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install radon==6.0.1
      - run: python tools/check_complexity.py
