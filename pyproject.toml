[build-system]
requires = ["setuptools>61"]
build-backend = "setuptools.build_meta"

[project]
name = "energiapy"
version = "2.3.0"
authors = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
  {name = "Efstratios N. Pistikopoulos", email = "stratos@tamu.edu"}
]
maintainers = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
]
description = "For multiscale modeling and optimization of energy systems"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["modeling", "optimization", "energy systems", "ems", "multiscale"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ["gana[highs]>=1.6.0,<2", "ppopt", "dill", "IPython", "matplotlib", "scipy", "pandas", "numpy", "gurobipy", "scikit-learn", "vaelchi>=0.3.0,<0.4"]

[project.optional-dependencies]
highs = []
all = ["pvlib", "windpowerlib", "h5pyd"]
test = ["coverage", "pytest", "pytest-cov", "hypothesis", "flake8"]
docs = [
    "sphinx>=8.2,<9",
    "sphinx-book-theme>=1.4,<1.5",
    "myst-nb",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-design",
    "sphinx-tabs",
    "sphinx-thebe",
    "sphinx-examples",
    "sphinxext-opengraph",
    "sphinxcontrib-bibtex",
    "nbconvert",
    "nbformat",
]

[project.urls]
Homepage = "https://github.com/TAMUparametric/energiapy"
Issues = "https://github.com/TAMUparametric/energiapy/issues"
Changelog = "https://github.com/TAMUparametric/energiapy/blob/main/CHANGELOG.md"
